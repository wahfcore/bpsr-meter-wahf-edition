<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BPSR METER: WAHF EDITION</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hack-font@3/build/web/hack.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dps-meter">
        <header class="controls">
            <div class="sync-button" id="sync-button" title="Reset & Snapshot">
                <i class="fa-solid fa-arrows-rotate"></i>
            </div>
            <select class="encounter-select" id="encounter-select" title="View encounter history">
                <option value="live">Live</option>
            </select>
            <button class="snapshot-toggle" id="snapshot-toggle" title="Auto-log snapshots (off)">
                <i class="fa-solid fa-camera"></i>
            </button>
            <div class="drag-indicator drag-button" id="drag-indicator" title="Move window">
                <i class="fa-solid fa-up-down-left-right"></i>
            </div>
            <button class="control-button advanced-lite-btn always-clickable" id="nearby-group-btn" title="Toggle Nearby/Solo">Nearby</button>
            <div style="flex: 1;"></div>
            <button class="sort-button always-clickable active" id="sort-dmg-btn" title="Sort by Total DMG">DMG</button>
            <button class="sort-button always-clickable" id="sort-tank-btn" title="Sort by DMG Taken">TANK</button>
            <button class="sort-button always-clickable" id="sort-heal-btn" title="Sort by Total Heal">HEAL</button>
            <div style="flex: 1;"></div>
            <button class="control-button scale-button" id="scale-button" title="Change scale">1</button>
            <button class="control-button lock-button" id="lock-button" title="Lock position"><i class="fa-solid fa-lock-open"></i></button>
            <button class="control-button close-button" id="close-button" title="Close window"><i class="fa-solid fa-xmark"></i></button>
        </header>
        <div id="boss-hp-container">
            <div class="boss-header">
                <span class="boss-name" id="boss-name"></span>
                <span class="boss-hp-text" id="boss-hp-text"></span>
            </div>
            <div class="boss-bar">
                <div class="boss-bar-fill" id="boss-bar-fill"></div>
            </div>
        </div>
        <div id="loading-indicator">
            <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
        <main id="player-bars-container" style="display: none;"></main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
